name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install parsers and linter
        run: python -m pip install --upgrade pip pypdf python-docx python-pptx ruff
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Lint (fatal errors only)
        run: ruff check --select E9,F63,F7,F82 scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip python-docx python-pptx pypdf
      - name: Build math example (draft; fill is model work)
        run: |
          python scripts/coach.py build --workspace artifacts/math --course 高等数学 --subject math \
            --materials examples/subject_math --target 80 --days 10 --format md,docx || test $? -eq 1
      - name: Build law example (draft; fill is model work)
        run: |
          python scripts/coach.py build --workspace artifacts/law --course 法学基础 --subject law \
            --materials examples/subject_law --target 80 --days 10 --format md,docx || test $? -eq 1
      - name: Upload five books
        uses: actions/upload-artifact@v4
        with:
          name: review-sprint-five-books
          path: artifacts/**/output
