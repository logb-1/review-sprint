name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install parsers, linter, coverage
        run: python -m pip install --upgrade pip pypdf python-docx python-pptx ruff coverage
      - name: Compile
        run: python -m compileall -q scripts tests eval
      - name: Lint (undefined names / unused imports)
        run: ruff check --select E9,F scripts tests eval
      - name: Unit tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -q
          python -m coverage report --include="scripts/*" --fail-under=50
      - name: CLI surface
        run: python -m unittest tests.test_surface -q

  build-artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip python-docx python-pptx pypdf
      - name: Build examples and assert draft gates
        run: python scripts/check_build.py --out-root artifacts
      - name: Upload five books
        uses: actions/upload-artifact@v4
        with:
          name: review-sprint-five-books
          path: artifacts/**/output
